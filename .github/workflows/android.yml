name: Android build
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's ubuntu runners already ship with the Android SDK, so the
      # separate setup-android action is not needed. Just accept licenses so
      # Gradle can download any missing SDK piece.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # The repo is kept flat (all files in one folder) so it can be uploaded
      # from an iPad. This step rebuilds the real folder layout.
      - name: Arrange files
        run: |
          mkdir -p www/fonts resources
          cp index.html www/
          cp *.woff OFL-*.txt www/fonts/
          cp icon.png icon-foreground.png icon-background.png splash.png resources/

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate icons and splash (non-fatal)
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --assetPath resources || echo "icon generation skipped"

      - name: Lock to portrait
        run: sed -i '0,/<activity/s//<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      # Give the WebView more memory headroom and force GPU compositing.
      # Idempotent (safe to run twice) and non-fatal (the build continues even
      # if the manifest layout ever changes).
      - name: Native tuning (largeHeap, hardwareAccelerated)
        run: |
          python3 - <<'PY' || echo "manifest tuning skipped"
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          m = re.search(r"<application\b[^>]*>", s)
          if not m:
              raise SystemExit("no <application> tag found")
          tag = new = m.group(0)
          for attr in ("largeHeap", "hardwareAccelerated"):
              full = 'android:%s="true"' % attr
              if re.search(r'android:%s="[^"]*"' % attr, new):
                  new = re.sub(r'android:%s="[^"]*"' % attr, full, new)
              else:
                  new = new.replace("<application", "<application " + full, 1)
          s = s.replace(tag, new, 1)
          open(p, "w", encoding="utf-8").write(s)
          print("patched:", new.replace("\n", " ")[:200])
          PY
          grep -n 'largeHeap\|hardwareAccelerated' android/app/src/main/AndroidManifest.xml || echo "WARNING: attributes not found in manifest"

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: animal-sound-safari-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
