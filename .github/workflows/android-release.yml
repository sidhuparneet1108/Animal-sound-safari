name: Android release
# Signed Play Store bundle (.aab) + signed release APK. Uses REAL ads.
# Needs the 4 repository secrets created from the "Create upload key" workflow.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown to users, e.g. 1.0.0"
        required: true
        default: "1.0.0"
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ASF_KEYSTORE_PATH: /tmp/upload-keystore.jks
      ASF_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ASF_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ASF_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      INPUT_VERSION: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # GitHub's ubuntu runners already ship with the Android SDK, so the
      # separate setup-android action is not needed. Just accept licenses so
      # Gradle can download any missing SDK piece.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Check the 4 signing secrets exist
        run: |
          for v in ASF_KEYSTORE_PASSWORD ASF_KEY_ALIAS ASF_KEY_PASSWORD KEYSTORE_B64; do
            if [ -z "${!v}" ]; then echo "ERROR: secret for $v is missing or empty. Create the 4 secrets first (see README-FIRST.txt)."; exit 1; fi
          done
          echo "All 4 secrets present."

      - name: Decode the upload keystore
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$ASF_KEYSTORE_PATH"
          test -s "$ASF_KEYSTORE_PATH" || { echo "ERROR: keystore file is empty - check ANDROID_KEYSTORE_BASE64"; exit 1; }
          keytool -list -keystore "$ASF_KEYSTORE_PATH" -storepass "$ASF_KEYSTORE_PASSWORD" -alias "$ASF_KEY_ALIAS" | head -5

      - name: Work out version name and number
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="$INPUT_VERSION"; fi
          if ! [[ "$V" =~ ^[0-9]+(\.[0-9]+){1,3}([-.][0-9A-Za-z]+)?$ ]]; then echo "ERROR: version '$V' looks wrong (use something like 1.0.0)"; exit 1; fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Version name: $V   Version code: ${{ github.run_number }}"

      # The repo is kept flat (all files in one folder) so it can be uploaded
      # from an iPad. This step rebuilds the real folder layout.
      - name: Arrange files
        run: |
          mkdir -p www/fonts resources
          cp index.html www/
          cp *.woff OFL-*.txt www/fonts/
          cp icon.png icon-foreground.png icon-background.png splash.png resources/

      # Release build = REAL ads. Flip the one switch in the game file, and prove it.
      - name: Switch ads to REAL mode
        run: |
          n=$(grep -c 'var ADS_TEST_MODE = true;' www/index.html || true)
          [ "$n" = "1" ] || { echo "ERROR: expected exactly one 'var ADS_TEST_MODE = true;' line, found $n"; exit 1; }
          sed -i 's/var ADS_TEST_MODE = true;/var ADS_TEST_MODE = false;/' www/index.html
          f=$(grep -c 'var ADS_TEST_MODE = false;' www/index.html || true)
          t=$(grep -c 'ADS_TEST_MODE = true' www/index.html || true)
          echo "after change: false-lines=$f true-lines=$t"
          [ "$f" = "1" ] && [ "$t" = "0" ] || { echo "ERROR: ADS_TEST_MODE replacement did not work"; exit 1; }
          grep -n 'var ADS_TEST_MODE' www/index.html
          grep -c 'ca-app-pub-1719282988189198/2020937253' www/index.html

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate icons and splash (non-fatal)
        run: |
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --assetPath resources || echo "icon generation skipped"

      # Portrait lock, memory headroom, GPU drawing, AdMob App ID, and removal of
      # the advertising-ID permission (apps for children must not use it).
      # Safe to run twice. Stops the build loudly if the AdMob entries are missing.
      - name: Configure AndroidManifest (AdMob, portrait, memory)
        run: |
          python3 - <<'PY'
          import re, sys
          ADMOB_APP_ID = "ca-app-pub-1719282988189198~5009440555"   # the app's real AdMob App ID (safe with test ad units)
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()

          m = re.search(r"<manifest\b[^>]*>", s)
          if not m:
              sys.exit("ERROR: no <manifest> tag found")
          if "xmlns:tools=" not in m.group(0):
              s = s.replace(m.group(0), m.group(0).replace("<manifest", '<manifest xmlns:tools="http://schemas.android.com/tools"', 1), 1)

          def set_attr(tag, attr, value):
              full = 'android:%s="%s"' % (attr, value)
              if re.search(r'android:%s="[^"]*"' % attr, tag):
                  return re.sub(r'android:%s="[^"]*"' % attr, full, tag)
              return re.sub(r"^<(\w+)", lambda mm: "<%s %s" % (mm.group(1), full), tag, count=1)

          m = re.search(r"<application\b[^>]*>", s)
          if not m:
              sys.exit("ERROR: no <application> tag found")
          tag = m.group(0)
          for a in ("largeHeap", "hardwareAccelerated"):
              tag = set_attr(tag, a, "true")
          s = s.replace(m.group(0), tag, 1)

          m = re.search(r"<activity\b[^>]*>", s)
          if not m:
              sys.exit("ERROR: no <activity> tag found")
          s = s.replace(m.group(0), set_attr(m.group(0), "screenOrientation", "portrait"), 1)

          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              meta = '    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="%s"/>\n' % ADMOB_APP_ID
              if "</application>" not in s:
                  sys.exit("ERROR: no </application> found")
              s = s.replace("</application>", meta + "    </application>", 1)

          if 'com.google.android.gms.permission.AD_ID' not in s:
              perm = '    <uses-permission android:name="com.google.android.gms.permission.AD_ID" tools:node="remove"/>\n'
              s = s.replace("</manifest>", perm + "</manifest>", 1)

          open(p, "w", encoding="utf-8").write(s)

          # Loud checks: the build must stop here if anything is missing.
          s = open(p, encoding="utf-8").read()
          need = [
              'com.google.android.gms.ads.APPLICATION_ID',
              ADMOB_APP_ID,
              'com.google.android.gms.permission.AD_ID',
              'tools:node="remove"',
              'xmlns:tools=',
              'android:screenOrientation="portrait"',
              'android:largeHeap="true"',
              'android:hardwareAccelerated="true"',
          ]
          missing = [x for x in need if x not in s]
          if missing:
              sys.exit("ERROR: manifest is missing: %s" % missing)
          if s.count("com.google.android.gms.ads.APPLICATION_ID") != 1 or s.count("permission.AD_ID") != 1:
              sys.exit("ERROR: duplicated AdMob entries in manifest")
          print("Manifest OK")
          PY
          echo "----- AndroidManifest.xml -----"
          cat android/app/src/main/AndroidManifest.xml
          echo "----- checks -----"
          grep -n 'APPLICATION_ID\|AD_ID\|largeHeap\|hardwareAccelerated\|screenOrientation' android/app/src/main/AndroidManifest.xml

      - name: Sync web assets
        run: npx cap sync android

      - name: Check the REAL-ads switch made it into the Android app
        run: |
          f=android/app/src/main/assets/public/index.html
          grep -c 'var ADS_TEST_MODE = false;' "$f" | grep -qx 1 || { echo "ERROR: Android copy of index.html is not in REAL mode"; exit 1; }
          if grep -q 'ADS_TEST_MODE = true' "$f"; then echo "ERROR: test mode still present"; exit 1; fi
          echo "OK: Android copy is in REAL mode"

      - name: Add signing, version number and version name to app/build.gradle
        run: |
          python3 - <<'PY'
          import os, re, sys
          p = "android/app/build.gradle"
          s = open(p, encoding="utf-8").read()
          code = os.environ.get("VERSION_CODE", "")
          name = os.environ.get("VERSION_NAME", "")
          if not re.fullmatch(r"[0-9]+", code) or not re.fullmatch(r"[0-9A-Za-z.\-]+", name):
              sys.exit("ERROR: bad VERSION_CODE / VERSION_NAME: %r %r" % (code, name))

          s, n1 = re.subn(r"versionCode\s+\d+", "versionCode " + code, s, count=1)
          s, n2 = re.subn(r'versionName\s+"[^"]*"', 'versionName "' + name + '"', s, count=1)
          if n1 != 1 or n2 != 1:
              sys.exit("ERROR: could not find versionCode/versionName in defaultConfig")

          if "signingConfigs.release" not in s:
              block = (
                  "    // Release signing, added by the android-release workflow. Values come from GitHub secrets via environment variables.\n"
                  "    signingConfigs {\n"
                  "        release {\n"
                  '            storeFile file(System.getenv("ASF_KEYSTORE_PATH"))\n'
                  '            storePassword System.getenv("ASF_KEYSTORE_PASSWORD")\n'
                  '            keyAlias System.getenv("ASF_KEY_ALIAS")\n'
                  '            keyPassword System.getenv("ASF_KEY_PASSWORD")\n'
                  "        }\n"
                  "    }\n"
              )
              m = re.search(r"^([ \t]*)buildTypes\s*\{", s, re.M)
              if not m:
                  sys.exit("ERROR: 'buildTypes {' not found in app/build.gradle")
              s = s[:m.start()] + block + s[m.start():]
              s, n3 = re.subn(r"(buildTypes\s*\{\s*release\s*\{)", r"\1\n            signingConfig signingConfigs.release", s, count=1)
              if n3 != 1:
                  sys.exit("ERROR: 'buildTypes { release {' not found in app/build.gradle")

          for need in ("signingConfigs {", "signingConfig signingConfigs.release", "versionCode " + code, 'versionName "' + name + '"'):
              if need not in s:
                  sys.exit("ERROR: build.gradle patch check failed for: " + need)
          if s.count("signingConfig signingConfigs.release") != 1 or s.count("signingConfigs {") != 1:
              sys.exit("ERROR: signing block duplicated")
          open(p, "w", encoding="utf-8").write(s)
          print("build.gradle patched OK")
          PY
          echo "----- patched android/app/build.gradle -----"
          cat android/app/build.gradle

      - name: Build signed AAB and APK
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Check the built app (AD_ID must be absent; signature present)
        run: |
          ls -l android/app/build/outputs/bundle/release/ android/app/build/outputs/apk/release/
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump permissions android/app/build/outputs/apk/release/*.apk || true
            if "$AAPT2" dump permissions android/app/build/outputs/apk/release/*.apk | grep -q 'AD_ID'; then
              echo "ERROR: the advertising-ID permission (AD_ID) is still in the app. Not allowed for a children's app."; exit 1
            fi
            echo "OK: no AD_ID permission"
          else
            echo "WARNING: aapt2 not found, could not check permissions"
          fi
          jarsigner -verify android/app/build/outputs/bundle/release/*.aab | head -3 || true

      - uses: actions/upload-artifact@v4
        with:
          name: animal-sound-safari-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: animal-sound-safari-release-apk
          path: android/app/build/outputs/apk/release/*.apk
